<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live browser</title>
<style>
:root {
  color-scheme: light dark;
  --bg: var(--tg-theme-secondary-bg-color, #111820);
  --surface: var(--tg-theme-bg-color, #1d2731);
  --ink: var(--tg-theme-text-color, #eef4f7);
  --muted: var(--tg-theme-hint-color, #afbbc5);
  --accent: var(--tg-theme-button-color, #9be3ce);
  --on-accent: var(--tg-theme-button-text-color, #102e26);
  font: 16px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink) }
main { max-width: 920px; margin: auto; padding: max(16px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)) }
header { display: flex; align-items: center; gap: 12px; margin: 2px 4px 16px }
.mark { width: 38px; height: 33px; border: 2px solid var(--accent); border-radius: 9px; background: linear-gradient(to bottom, transparent 7px, var(--accent) 7px 9px, transparent 9px); flex-shrink: 0 }
h1 { font-size: 20px; letter-spacing: -.035em; line-height: 1.2; margin: 0 }
#state { margin: 3px 0 0; font-size: 13px; color: var(--muted) }
.stage { background: #10151a; border-radius: 14px; outline: 1px solid #80808045; overflow: hidden; min-height: 96px; display: grid; align-items: center }
#screen { display: block; width: 100%; height: auto; touch-action: none }
#screen:not([src]) { visibility: hidden }
.tools, #decision { background: var(--surface); border-radius: 16px; padding: 12px; margin-top: 12px }
button, input { font: inherit; border-radius: 10px; min-height: 46px }
button { cursor: pointer; border: 1px solid #8886; color: var(--ink); background: var(--surface); padding: 8px 12px; font-weight: 600 }
button:active { filter: brightness(.9) }
button:disabled { opacity: .55; cursor: default }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.primary { background: var(--accent); color: var(--on-accent); border-color: transparent }
#control { width: 100% }
.row { display: flex; gap: 8px; margin-top: 10px }
.keys button { flex: 1 }
input { flex: 1; width: 0; min-width: 0; border: 1px solid #8887; background: var(--bg); color: var(--ink); padding: 8px 12px }
#review { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 12px }
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body><main>
<header><span class="mark" aria-hidden="true"></span><div><h1>Live browser</h1><p id="state" role="status">Connecting…</p></div></header>
<div class="stage"><img id="screen" alt="Live browser viewport"></div>
<section id="decision" hidden aria-label="Final action review"><p id="review"></p><div class="row"><button class="primary" id="approve">Approve final action</button><button id="reject">Reject</button></div></section>
<div class="tools"><button id="control" class="primary" disabled>Take control</button>
<div id="keyboard" hidden><div class="row"><input id="entry" type="password" autocomplete="off" aria-label="Text for the selected browser field" placeholder="Type into selected field"><button id="insert">Insert</button></div>
<div class="row keys"><button data-key="Tab">Tab</button><button data-key="Backspace">Backspace</button><button data-key="Enter">Enter</button></div></div></div>
</main>
<script>
const get=id=>document.getElementById(id), app=window.Telegram.WebApp, screenEl=get('screen');
app.ready(); app.expand(); app.disableVerticalSwipes?.();
const ws=new WebSocket('wss://'+location.host+location.pathname+'/ws');
const send=(action,details={})=>{if(ws.readyState===1) ws.send(JSON.stringify({action,...details}));};
let mode='',frame='',start;
ws.onopen=()=>ws.send(JSON.stringify({auth:app.initData}));
ws.onmessage=e=>{
 if(typeof e.data!=='string'){const old=frame;frame=URL.createObjectURL(e.data);screenEl.src=frame;if(old)URL.revokeObjectURL(old);return;}
 const s=JSON.parse(e.data);mode=s.mode;
 get('state').textContent={watch:'Watching agent',waiting:'Waiting for current step to finish',manual:'You control this tab'}[mode];
 get('control').disabled=false;get('control').textContent=mode==='watch'?'Take control':'Resume agent';
 get('keyboard').hidden=mode!=='manual';get('decision').hidden=!s.approval;get('review').textContent=s.approval;
};
ws.onclose=()=>{get('keyboard').hidden=true;get('decision').hidden=true;get('state').textContent='Disconnected. Reopen from the chat to reconnect.';get('control').disabled=true;};
get('control').onclick=()=>send(mode==='watch'?'take':'resume');
get('insert').onclick=()=>{send('text',{text:get('entry').value});get('entry').value='';};
for(const b of document.querySelectorAll('[data-key]')) b.onclick=()=>send('key',{key:b.dataset.key});
for(const id of ['approve','reject'])get(id).onclick=()=>send(id);
function point(e){const b=screenEl.getBoundingClientRect();return {x:(e.clientX-b.left)/b.width,y:(e.clientY-b.top)/b.height};}
screenEl.onpointerdown=e=>{start=e.clientY;screenEl.setPointerCapture(e.pointerId);};
screenEl.onpointerup=e=>{if(mode==='manual'){const dy=start-e.clientY;const scale=screenEl.naturalWidth/screenEl.getBoundingClientRect().width;send(Math.abs(dy)>8?'scroll':'tap',{...point(e),dy:dy*scale});}};
screenEl.onwheel=e=>{if(mode==='manual'){e.preventDefault();send('scroll',{...point(e),dy:e.deltaY});}};
</script></body></html>
