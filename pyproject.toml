[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application-agent"
version = "0.1.0"
description = "A modular, human-supervised job application assistant."
requires-python = ">=3.11"
dependencies = [
    "browser-use>=0.9.5,<1",
    "aiohttp>=3.10,<4",
    "httpx>=0.27,<1",
    "pypdf>=4",
    "reportlab>=4,<5",
]

[project.optional-dependencies]
llm = ["openai>=1.50,<2"]
dev = []

[project.scripts]
job-agent = "job_agent.cli:main"

[tool.setuptools.packages.find]
include = ["job_agent*"]

[tool.setuptools.package-data]
job_agent = ["workflow_skills/**/*.json", "live_browser.html"]

